name: CI

on:
  push:
    branches: [main]
  pull_request:


permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      # --lib covers unit tests in every workspace crate (aep-core AND
      # proxy-wasm-evidence); `-p aep-core` alone skipped the filter crate.
      - run: cargo test --workspace --lib --locked

  schema-conformance:
    name: AEP schema conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Emit sample AEP records
        run: cargo run --locked -p aep-core --example emit_aep_samples -- target/aep-samples
      - name: Fetch canonical schema (pinned @wasmagent/protocol)
        run: ci/fetch_aep_schema.sh target/schema
      - name: Validate samples against canonical aep-record schema
        run: |
          python3 -m pip install --quiet jsonschema
          python3 ci/validate_aep_records.py \
            --schema target/schema/aep-record.schema.json \
            --samples-dir target/aep-samples

  cross-language-conformance:
    name: AEP Cross-Language Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Checkout wasmagent-protocol (central corpus)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: WasmAgent/wasmagent-protocol
          ref: main
          path: wasmagent-protocol
      # `cargo test --lib` skips integration tests under crates/*/tests/ —
      # run the cross-language DSSE gate explicitly: JS-emitted fixtures must
      # verify under the Rust verifier and every tamper negative must fail.
      # The mirror gate (Rust-signed fixture verified by the JS verifier)
      # runs in wasmagent-js CI via its adversarial fixture test.
      - run: cargo test -p aep-core --test cross_language --locked

  protocol-corpus:
    name: AEP Protocol Corpus (consumer-side)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Checkout wasmagent-protocol (central corpus)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: WasmAgent/wasmagent-protocol
          ref: main
          path: wasmagent-protocol
      - name: Enforce corpus authenticity + chain verdicts
        run: cargo test --locked -p aep-core --test protocol_corpus
        env:
          AEP_PROTOCOL_CORPUS: ${{ github.workspace }}/wasmagent-protocol/conformance/aep

  wasm-build:
    name: Wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo build --locked -p proxy-wasm-evidence --target wasm32-wasip1 --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proxy-wasm-evidence.wasm
          path: target/wasm32-wasip1/release/proxy_wasm_evidence.wasm
