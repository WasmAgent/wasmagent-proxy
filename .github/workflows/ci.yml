name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test -p aep-core

  schema-conformance:
    name: AEP schema conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Emit sample AEP records
        run: cargo run -p aep-core --example emit_aep_samples -- target/aep-samples
      - name: Fetch canonical schema (pinned @wasmagent/protocol)
        run: ci/fetch_aep_schema.sh target/schema
      - name: Validate samples against canonical aep-record schema
        run: |
          python3 -m pip install --quiet jsonschema
          python3 ci/validate_aep_records.py \
            --schema target/schema/aep-record.schema.json \
            --samples-dir target/aep-samples

  wasm-build:
    name: Wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p proxy-wasm-evidence --target wasm32-wasip1 --release
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-wasm-evidence.wasm
          path: target/wasm32-wasip1/release/proxy_wasm_evidence.wasm
